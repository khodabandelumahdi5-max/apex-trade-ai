[theme]
base = "dark"
primaryColor = "#22c55e"
backgroundColor = "#0b0f14"
secondaryBackgroundColor = "#131a22"
textColor = "#e6edf3"
font = "sans serif"

[server]
headless = true
# No hot-reload: after `git pull` a running dashboard keeps its code until restarted, instead of
# reloading only the changed modules (which mixed old and new database connections).
fileWatcherType = "none"
runOnSave = false
